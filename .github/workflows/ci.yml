name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.test
          VITE_FIREBASE_API_KEY: synthetic-ci-web-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-careerscout-ai.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-careerscout-ai
          VITE_FIREBASE_STORAGE_BUCKET: demo-careerscout-ai.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          VITE_FIREBASE_APP_ID: 1:123456789012:web:syntheticci
          VITE_FIREBASE_APP_CHECK_SITE_KEY: synthetic-ci-site-key
          VITE_FIREBASE_APP_CHECK_DEBUG: "false"
          VITE_FIREBASE_USE_EMULATORS: "false"
        run: npm run build

      - name: Check bundle-size budgets
        working-directory: frontend
        run: npm run check:bundle

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend test suite
        working-directory: backend
        env:
          CAREERSCOUT_ENV: test
          RATE_LIMIT_STORAGE: memory
        run: python -m unittest discover -v

  firebase-and-playwright:
    name: Firebase emulator and Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Firebase emulator integration tests
        working-directory: frontend
        run: npm run test:emulator

      - name: Run Playwright E2E and accessibility tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          if-no-files-found: warn
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/firestore-debug.log
            frontend/firebase-debug.log

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - frontend
      - backend
      - firebase-and-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Add job results to the Actions summary
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.firebase-and-playwright.result }}
        run: |
          {
            echo "## CI results"
            echo
            echo "| Validation | Result |"
            echo "| --- | --- |"
            echo "| Frontend tests, production build, and bundle budget | ${FRONTEND_RESULT} |"
            echo "| Backend test suite | ${BACKEND_RESULT} |"
            echo "| Firebase emulator and Playwright tests | ${BROWSER_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
